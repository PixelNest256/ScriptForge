<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScriptForge Settings</title>
  <link rel="stylesheet" href="../popup/styles.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--bg); }
    body { display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #5a4bd1 0%, #7c5ce7 100%); padding: 14px 24px; flex-shrink: 0; }
    .header .header-row h1 { color: #fff; font-size: 18px; }
    .header .header-version { color: rgba(255,255,255,0.7); font-size: 11px; }
    .settings-body { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 200px; background: var(--surface); border-right: 1px solid var(--border); padding: 12px 0; flex-shrink: 0; }
    .sidebar-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 16px; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; text-align: left; transition: background 0.15s, color 0.15s; }
    .sidebar-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .sidebar-item.active { background: rgba(108,92,231,0.12); color: var(--accent); font-weight: 500; }
    .sidebar-item svg { flex-shrink: 0; }
    .settings-content { flex: 1; padding: 24px; overflow-y: auto; }
    .settings-section { display: none; }
    .settings-section.active { display: block; }
    .settings-section h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .settings-section .desc { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .field { max-width: 520px; }
    .field input { width: 100%; }
    .field select { width: 100%; }
    #settings-provider select { width: auto; min-width: 240px; }
    .input-with-btn { max-width: 520px; }
    .save-bar { max-width: 520px; }
    .preset-row { margin-bottom: 16px; }
    .save-bar { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .save-bar .status { margin: 0; }
    #settings-provider select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 13px; cursor: pointer; }
    #settings-provider select:focus { outline: none; border-color: var(--accent); }
    .input-with-btn { display: flex; gap: 0; }
    .input-with-btn input { flex: 1; border-radius: var(--radius) 0 0 var(--radius) !important; }
    .btn-icon { background: var(--surface); border: 1px solid var(--border); border-left: none; border-radius: 0 var(--radius) var(--radius) 0; cursor: pointer; color: var(--muted); padding: 0 10px; display: flex; align-items: center; transition: color 0.15s, background 0.15s; }
    .btn-icon:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .context-cards { display: flex; gap: 10px; }
    .context-card { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s; }
    .context-card:hover { border-color: var(--muted); }
    .context-card.active { border-color: var(--accent); background: rgba(108,92,231,0.08); }
    .context-card-radio { width: 18px; height: 18px; border: 2px solid var(--muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color 0.15s; }
    .context-card.active .context-card-radio { border-color: var(--accent); }
    .context-card-radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: transparent; transition: background 0.15s; }
    .context-card.active .context-card-radio::after { background: var(--accent); }
    .context-card-label { font-size: 13px; font-weight: 500; color: var(--text); }
    .context-card-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-row">
      <h1>ScriptForge Settings</h1>
      <span class="header-version" id="header-version"></span>
    </div>
  </header>

  <div class="settings-body">
    <nav class="sidebar">
      <button type="button" class="sidebar-item active" data-section="api">
        <svg viewBox="0 -960 960 960" width="18" height="18" fill="currentColor"><path d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-155.5t86-127Q252-817 325-848.5T480-880q83 0 155.5 31.5t127 86q54.5 54.5 86 127T880-480q0 82-31.5 155t-86 127.5q-54.5 54.5-127 86T480-80Zm0-80q133 0 226.5-93.5T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160Zm0-80q-100 0-170-70t-70-170q0-100 70-170t170-70q100 0 170 70t70 170q0 100-70 170t-170 70Zm0-80q66 0 113-47t47-113q0-66-47-113t-113-47q-66 0-113 47t-47 113q0 66 47 113t113 47Zm0-80q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-80Z"/></svg>
        API Settings
      </button>
      <button type="button" class="sidebar-item" data-section="privacy">
        <svg viewBox="0 -960 960 960" width="18" height="18" fill="currentColor"><path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q104-33 172-132t68-220v-189l-240-90-240 90v189q0 121 68 220t172 132Zm0-316Z"/></svg>
        Privacy & Security
      </button>
    </nav>

    <div class="settings-content">
      <!-- API Settings -->
      <div id="section-api" class="settings-section active">
        <h2>API Settings</h2>
        <p class="desc">Configure OpenAI-compatible API (/v1/chat/completions) settings.</p>
        <label class="field">
          <span>Provider</span>
          <div id="settings-provider"></div>
        </label>
        <label class="field">
          <span>API Base URL</span>
          <input type="url" id="api-base-url" autocomplete="off" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="field">
          <span>API Key</span>
          <div class="input-with-btn">
            <input type="password" id="api-key" autocomplete="off" placeholder="sk-... (can be empty for local APIs like Ollama)" />
            <button type="button" id="btn-toggle-api-key" class="btn-icon" title="Show API key">
              <svg viewBox="0 -960 960 960" width="16" height="16" fill="currentColor"><path d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-80q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29Zm0 200q-146 0-265-81.5T40-500q56-137 175-218.5T480-800q146 0 265 81.5T920-500q-56 137-175 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z"/></svg>
            </button>
          </div>
        </label>
        <label class="field">
          <span>Model Name</span>
          <input type="text" id="api-model" autocomplete="off" placeholder="gpt-4o-mini" />
        </label>
        <div class="save-bar">
          <button type="button" id="btn-save-settings" class="btn primary">Save</button>
          <button type="button" id="btn-test-api" class="btn secondary">Test Connection</button>
          <p id="settings-status" class="status"></p>
        </div>
      </div>

      <!-- Privacy & Security -->
      <div id="section-privacy" class="settings-section">
        <h2>Privacy & Security</h2>
        <p class="desc">Control how much page information is sent to the AI. Adjust the balance between script generation quality and privacy based on your selection.</p>
        <fieldset class="field page-context-field">
          <span>Page info sent to AI</span>
          <div class="context-cards" id="page-context-control">
            <button type="button" class="context-card active" data-value="dom">
              <span class="context-card-radio"></span>
              <span class="context-card-label">DOM Tree</span>
              <span class="context-card-desc">Tag/id/class structure only. Lightweight and privacy-friendly (recommended).</span>
            </button>
            <button type="button" class="context-card" data-value="html">
              <span class="context-card-radio"></span>
              <span class="context-card-label">Full HTML</span>
              <span class="context-card-desc">Sends outerHTML. Truncated to ~45KB when sent to the API.</span>
            </button>
          </div>
          <input type="radio" name="page-context-mode" value="dom" checked hidden />
          <input type="radio" name="page-context-mode" value="html" hidden />
        </fieldset>
      </div>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
