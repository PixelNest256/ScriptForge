<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScriptForge</title>
  <link rel="stylesheet" href="../popup/styles.css" />
  <style>
    body { width: 100%; min-height: 100vh; }
    .header .header-row h1 { font-size: 18px; }
    .chat-messages { max-height: 50vh; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-row">
      <h1>ScriptForge</h1>
      <span class="header-version" id="header-version"></span>
      <span class="header-spacer"></span>
      <button type="button" id="btn-open-settings" class="btn-header" title="Settings">
        <svg viewBox="0 -960 960 960" width="18" height="18" fill="currentColor"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
      </button>
    </div>
    <nav class="tabs">
      <button type="button" class="tab active" data-view="list">Scripts</button>
      <button type="button" class="tab" data-view="chat">Create</button>
    </nav>
  </header>

  <main>
    <section id="view-list" class="view active">
      <div class="toolbar">
        <button type="button" id="btn-import-file" class="btn secondary">
          <svg viewBox="0 -960 960 960" width="14" height="14" fill="currentColor"><path d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>
          Import
        </button>
      </div>
      <ul id="script-list" class="script-list"></ul>
      <p id="list-empty" class="empty hidden">No scripts yet.</p>
    </section>

    <section id="view-chat" class="view hidden">
      <div id="chat-output" class="chat-output hidden"></div>
      <div id="chat-empty-state" class="chat-empty-state">
        <div class="chat-empty-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <h2 class="chat-empty-title">What would you like to create?</h2>
        <p class="chat-empty-desc">Describe the extension you need in natural language, and I'll generate it for you.</p>
      </div>
      <div class="chat-input-area">
        <form id="chat-form" class="chat-form">
          <div class="chat-input-wrapper">
            <textarea id="chat-input" rows="1" placeholder="Describe the extension you want..." autofocus></textarea>
            <button type="submit" id="btn-send" class="btn-send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
          </div>
        </form>
        <div class="chat-input-row">
          <p id="page-context-hint" class="chat-context-hint"></p>
          <p id="chat-status-bar" class="chat-status-bar"></p>
        </div>
      </div>
    </section>
  </main>

  <input type="file" id="import-file" accept=".user.js,.js" hidden />

  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <p id="modal-message"></p>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="edit-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal modal-wide">
      <h3 id="edit-title">Edit Script</h3>
      <textarea id="edit-code" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="edit-cancel">Cancel</button>
        <button type="button" class="btn primary" id="edit-save">Analyze & Save</button>
      </div>
    </div>
  </div>

  <div id="prompt-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <p id="prompt-message"></p>
      <input type="text" id="prompt-input" />
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="prompt-cancel">Cancel</button>
        <button type="button" class="btn primary" id="prompt-ok">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
