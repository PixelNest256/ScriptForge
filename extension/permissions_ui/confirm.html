<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Permission Review — ScriptForge</title>
  <link rel="stylesheet" href="../popup/styles.css" />
  <style>
    body { width: 460px; min-height: 500px; padding: 16px; }
    .perm-list { margin: 12px 0; }
    .perm-item { padding: 10px; background: var(--surface); border-radius: var(--radius); margin-bottom: 8px; border: 1px solid var(--border); }
    .perm-item h4 { font-size: 13px; margin-bottom: 4px; }
    .not-detected { margin-top: 16px; }
    .not-detected li { color: var(--ok); font-size: 12px; margin: 4px 0; }
    .actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    .warning-title { font-size: 15px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2 class="warning-title">Review permissions for this script</h2>
  <p id="script-info" class="meta"></p>

  <section id="section-detected">
    <h3>Detected Permissions</h3>
    <div id="perm-detected" class="perm-list"></div>
  </section>

  <section class="not-detected">
    <h3>Not Detected</h3>
    <ul id="perm-not-detected"></ul>
  </section>

  <div class="actions">
    <button type="button" id="btn-reject" class="btn secondary">Reject</button>
    <button type="button" id="btn-approve" class="btn primary">Approve & Save</button>
  </div>

  <p id="confirm-status" class="status"></p>
  <script type="module" src="confirm.js"></script>
</body>
</html>
